<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Diamond Rush</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #000; overflow: hidden;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
    }
    #cargando {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #e8d9a8; font: 20px/1.4 sans-serif; text-align: center;
      padding: 16px; z-index: 1;
    }
    canvas#canvas {
      display: block; margin: 0 auto; outline: none;
      touch-action: none; position: relative; z-index: 2;
    }
  </style>
</head>
<body>
  <div id="cargando">Cargando Diamond Rush...</div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <script>
    var Module = {
      canvas: (function () { return document.getElementById('canvas'); })(),
      print: function (t) { console.log(t); },
      printErr: function (t) { console.warn(t); },
      setStatus: function (t) {
        var c = document.getElementById('cargando');
        if (!c) return;
        if (t === '') { c.style.display = 'none'; }
        else { c.style.display = 'flex'; c.textContent = t; }
      },
      onAbort: function () {
        var c = document.getElementById('cargando');
        if (c) { c.style.display = 'flex'; c.textContent = 'Error al iniciar el juego. Recarga la pagina.'; }
      }
    };
    // Evita que el navegador haga scroll o zoom con los gestos sobre el juego
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
    window.addEventListener('keydown', function (e) {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) >= 0) e.preventDefault();
    }, { passive: false });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
