name: Compilar y publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - name: Descargar y compilar raylib para web
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git raylib
          make -C raylib/src PLATFORM=PLATFORM_WEB -j"$(nproc)"
          find raylib/src -maxdepth 1 -name 'libraylib*.a'

      - name: Compilar el juego
        run: ./build.sh raylib/src

      - name: Preparar la pagina
        run: touch public/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir la pagina
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
